name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"

jobs:
  web:
    name: Web — types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run lint:web
      - run: npm run test:web
      # No API_URL here on purpose: the build must never depend on the API or its settings.
      - run: npm run build:web

  api:
    name: API — lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tindawise
          POSTGRES_PASSWORD: tindawise_ci # throwaway CI database, not a secret
          POSTGRES_DB: tindawise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tindawise"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://tindawise:tindawise_ci@localhost:5432/tindawise_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  ml:
    name: ML — lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/ml/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -W error
      # Smoke test: the command documented in docs/ml/EXPERIMENTS.md still runs end to end.
      - run: python -m tindawise_ml backtest

  e2e:
    name: End-to-end — Playwright on the full stack
    needs: [web, api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tindawise
          POSTGRES_PASSWORD: tindawise_ci # throwaway CI database, not a secret
          POSTGRES_DB: tindawise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tindawise"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://tindawise:tindawise_ci@localhost:5432/tindawise
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Set up the API (venv, migrations, sample store and demo accounts)
        working-directory: services/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
          .venv/bin/alembic upgrade head
          .venv/bin/python -m scripts.seed

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
