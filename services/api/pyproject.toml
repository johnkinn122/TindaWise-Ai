[project]
name = "tindawise-api"
version = "0.1.0"
description = "Tindawise AI backend: products, inventory, and business data API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",  # email-validator for EmailStr
    "pydantic-settings>=2.6",
    "argon2-cffi>=25.1",  # password hashing (Argon2id)
    "tzdata>=2024.1",  # time zone database for zoneinfo (Windows has none built in)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",  # Starlette TestClient transport (successor of httpx)
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in default arguments is the intended pattern

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]  # autogenerated by Alembic
"scripts/seed.py" = ["E501"]  # one product per row reads better as a table

[tool.ruff.format]
exclude = ["migrations/versions/*.py", "scripts/seed.py"]
